version: "3.8"

# Fully isolated infra for this showcase project - separate ports/network from
# any other Kafka/Redis already running on the host, so it never touches
# shared/dev infrastructure and is 100% reproducible with `docker compose up`.

services:
  redis:
    image: redis:7
    container_name: swym-showcase-redis
    ports:
      - "6390:6379"
    networks: [swym-showcase]

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: swym-showcase-zookeeper
    ports:
      - "2192:2181"
    networks: [swym-showcase]

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: swym-showcase-kafka
    depends_on: [zookeeper]
    ports:
      - "19092:19092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: swym-showcase-zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://swym-showcase-kafka:9092,PLAINTEXT_HOST://127.0.0.1:19092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:19092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [swym-showcase]

networks:
  swym-showcase:
    name: swym-showcase
